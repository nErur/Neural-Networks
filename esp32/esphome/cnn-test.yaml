# Config de la carte de test CNN (MNIST pour commencer), gérée par l'ESPHome de Home Assistant.
# La config vivante est dans HA ; ce fichier en est la référence versionnée.
# Identique à la config de HA : les secrets sont dans /config/esphome/secrets.yaml.
esphome:
  name: cnn-test
  friendly_name: CNN test

esp32:
  board: esp32dev          # ESP-WROOM-32, même puce que la carte PZEM
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: !secret cnn_test_api_key
  actions:
    - action: classify               # image brute 28×28, 784 entiers 0..255 (send.py)
      variables:
        image: int[]
      then:
        - lambda: id(mnist).submit_image(image);

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "cnn-test fallback"
    password: !secret cnn_test_ap_password

captive_portal:

# Composant nn_mnist lu dans le dépôt privé GitHub.
external_components:
  - source:
      type: git
      url: https://github.com/nErur/Neural-Networks
      ref: master                      # plus tard : un tag pour la carte PZEM
      path: esp32/esphome/components
      username: !secret github_user
      password: !secret github_token
    components: [nn_mnist, nn_spectrasense]
    refresh: 0s                        # récupère le dernier commit à chaque compilation

# LED bleue « D2 » de la carte (GPIO2, allumée à l'état haut) : témoin d'inférence.
# GPIO2 est une broche de démarrage (strapping) ; la LED ne gêne pas le démarrage.
output:
  - platform: gpio
    id: led_d2
    pin:
      number: GPIO2
      ignore_strapping_warning: true

nn_mnist:
  id: mnist
  activity_output: led_d2
  activity_duration: 150ms
  weights_in_ram: true          # expérience : false = poids lus en flash
  prediction:
    name: "Chiffre prédit"
  confidence:
    name: "Confiance"
  margin:
    name: "Marge"
  inference_time:
    name: "Temps d'inférence"
  expected_label:
    name: "Étiquette attendue"
  max_error:
    name: "Écart max vs Python"
  model_id:
    name: "Modèle"
  autotest:
    name: "Bilan autotest"

# Réseau convolutif SpectraSense (12 classes) : autotest, profilage, et chaîne complète en direct,
# en parallèle de la carte PZEM : la puissance de la ligne arrive par Home Assistant.
# Utilise le moteur de nn_mnist (une seule copie dans le firmware).
nn_spectrasense:
  id: spectra
  weights_in_ram: true
  power: puissance_ligne
  time_id: heure_ha             # état long (arrêt / veille / maintien) gardé d'un redémarrage à l'autre
  clock_delay: 2s               # horloge en retard (rafales HA) ; 0s sur la carte PZEM
  threshold: 0.95               # réglages de l'automate retenus sur la validation
  hold: 1
  peak_threshold: 0.5
  machine:
    name: "Machine à café"
  toaster:
    name: "Grille-pain"
  kettle:
    name: "Bouilloire"
  unknown_load:
    name: "Consommateur inconnu"
  gate:
    name: "SpectraSense porte"
  network_class:
    name: "SpectraSense classe du réseau"
  invalid_seconds:
    name: "SpectraSense secondes invalides"
  model_id:
    name: "SpectraSense modèle"
  autotest:
    name: "SpectraSense autotest"
  inference_time:
    name: "SpectraSense temps d'inférence"
  max_error:
    name: "SpectraSense écart max vs Python"

time:
  - platform: homeassistant
    id: heure_ha

sensor:
  # Puissance de la ligne arrière-cuisine, lue dans HA (carte PZEM) : entrée de la chaîne.
  - platform: homeassistant
    id: puissance_ligne
    entity_id: sensor.esphome_web_9f0748_power
    internal: true
  # Entités de diagnostic de la carte.
  - platform: uptime
    name: "Uptime"
  - platform: wifi_signal
    name: "Signal Wi-Fi"
    update_interval: 60s

text_sensor:
  - platform: version
    name: "Version ESPHome"

button:
  - platform: restart
    name: "Redémarrer"
  - platform: template
    name: "Image de test suivante"
    on_press:
      - lambda: id(mnist).next_test_image();
  - platform: template
    name: "Lancer l'autotest"
    on_press:
      - lambda: id(mnist).run_autotest();
  - platform: template
    name: "Profilage"
    on_press:
      - lambda: id(mnist).run_profile();
  - platform: template
    name: "SpectraSense autotest"
    on_press:
      - lambda: id(spectra).run_autotest();
  - platform: template
    name: "SpectraSense profilage"
    on_press:
      - lambda: id(spectra).run_profile();
