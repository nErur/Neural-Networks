# Variante de secours : compilation sur le PC (CLI), composant lu localement.
esphome:
  name: cnn-test
  friendly_name: CNN test

esp32:
  board: esp32dev          # ESP-WROOM-32, même puce que la carte PZEM
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:                      # point d'accès de secours si le Wi-Fi échoue
    ssid: "cnn-test fallback"
    password: !secret fallback_password

captive_portal:

external_components:
  - source:
      type: local
      path: components

# LED bleue « D2 » de la carte (GPIO2, allumée à l'état haut) : témoin d'inférence.
# GPIO2 est une broche de démarrage (strapping) ; la LED ne gêne pas le démarrage.
output:
  - platform: gpio
    id: led_d2
    pin:
      number: GPIO2
      ignore_strapping_warning: true

nn_mnist:
  id: mnist
  activity_output: led_d2
  activity_duration: 150ms
  weights_in_ram: true          # expérience : false = poids lus en flash
  prediction:
    name: "Chiffre prédit"
  confidence:
    name: "Confiance"
  margin:
    name: "Marge"
  inference_time:
    name: "Temps d'inférence"
  expected_label:
    name: "Étiquette attendue"
  max_error:
    name: "Écart max vs Python"
  model_id:
    name: "Modèle"
  autotest:
    name: "Bilan autotest"
