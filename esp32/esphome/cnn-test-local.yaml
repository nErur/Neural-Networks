# Variante de secours : compilation sur le PC (CLI), composant lu localement.
esphome:
  name: cnn-test
  friendly_name: CNN test

esp32:
  board: esp32dev          # ESP-WROOM-32, même puce que la carte PZEM
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:                      # point d'accès de secours si le Wi-Fi échoue
    ssid: "cnn-test fallback"
    password: !secret fallback_password

captive_portal:

external_components:
  - source:
      type: local
      path: components

nn_mnist:
  id: mnist
  prediction:
    name: "Chiffre prédit"
  confidence:
    name: "Confiance"
  margin:
    name: "Marge"
  inference_time:
    name: "Temps d'inférence"
  expected_label:
    name: "Étiquette attendue"
  max_error:
    name: "Écart max vs Python"
  model_id:
    name: "Modèle"
  autotest:
    name: "Bilan autotest"
